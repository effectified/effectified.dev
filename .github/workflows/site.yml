# Checks and builds the site on every pull request, and deploys it to Cloudflare Workers when what it shows changes.
# Nothing polls: a push to main deploys; effectified/packages calls this workflow from its release workflow after CI
# passes on its main (a facade changed or was released); effectified/pi's release script starts it after a release.
name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Called from another repository, the event is that repository's: check out the site's main by name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: effectified/effectified.dev
          ref: ${{ github.repository == 'effectified/effectified.dev' && github.ref || 'main' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: effectified/packages
          path: .packages
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check and build
        env:
          EFFECTIFIED_PACKAGES: ${{ github.workspace }}/.packages
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm check
          pnpm build
      # The deploy needs the two Cloudflare secrets; without them the workflow stops after the build.
      - if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec cf deploy ./dist
