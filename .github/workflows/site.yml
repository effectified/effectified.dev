# Checks and builds the site on every pull request. Deploys it to Cloudflare Workers when something it shows has
# changed: a push to main, or, checked every 30 minutes, a new commit or release of effectified/packages (whose
# facades the site builds a page for each) or a new release of effectified/pi. Each build records what it was built
# from in /build.json, so a scheduled check that finds nothing new deploys nothing.
name: site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: What the site shows now
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          packages=$(git ls-remote https://github.com/effectified/packages refs/heads/main | cut -f1)
          facades=$(gh api 'repos/effectified/packages/releases?per_page=1' --jq '.[0].tag_name')
          pi=$(gh api 'repos/effectified/pi/releases?per_page=1' --jq '.[0].tag_name')
          sources="packages@$packages $facades pi@$pi"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          deployed=$(curl -fsS https://effectified.dev/build.json | jq -r '.sources // ""' || true)
          if [ "$EVENT" = "schedule" ] && [ "$deployed" = "$sources" ]; then
            echo "effectified.dev shows $sources already"
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sources.outputs.current != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.sources.outputs.current != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: effectified/packages
          path: .packages
      - if: steps.sources.outputs.current != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.sources.outputs.current != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.sources.outputs.current != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.sources.outputs.current != 'true'
        name: Check and build
        env:
          EFFECTIFIED_PACKAGES: ${{ github.workspace }}/.packages
          EFFECTIFIED_SOURCES: ${{ steps.sources.outputs.sources }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm check
          pnpm build
      # The deploy needs the two Cloudflare secrets; without them the workflow stops after the build.
      - if: steps.sources.outputs.current != 'true' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec cf deploy ./dist
