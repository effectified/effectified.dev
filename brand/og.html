<!doctype html>
<!-- The source of public/og.png (1200x630): `pnpm og` renders this page with headless Chrome. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face { font-family: "Inter Display"; src: url("../public/fonts/InterDisplay-Bold.woff2"); font-weight: 700; }
			@font-face { font-family: "JetBrains Mono"; src: url("../public/fonts/JetBrainsMono-Medium.woff2"); font-weight: 500; }
			html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #09090b; }
			body { position: relative; -webkit-font-smoothing: antialiased; }
			.scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; }
			.scrim {
				position: absolute; inset: 0;
				background:
					linear-gradient(90deg, #09090b 0%, rgb(9 9 11 / 0.9) 30%, rgb(9 9 11 / 0.3) 55%, rgb(9 9 11 / 0) 70%),
					linear-gradient(0deg, rgb(9 9 11 / 0.8) 0%, rgb(9 9 11 / 0) 30%);
			}
			.lockup { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; color: #fff; }
			.lockup svg { width: 36px; height: 36px; }
			.lockup span { font: 700 34px/1 "Inter Display"; letter-spacing: -0.022em; }
			h1 { position: absolute; left: 72px; top: 200px; margin: 0; font: 700 112px/0.95 "Inter Display"; letter-spacing: -0.045em; }
			h1 .a { background: linear-gradient(90deg, #fff 0%, #fff 70%, #96969c 100%); -webkit-background-clip: text; color: transparent; display: block; }
			h1 .b { background: linear-gradient(90deg, #a78bfa 0%, #60a5fa 52%, #34d399 100%); -webkit-background-clip: text; color: transparent; display: inline-block; padding-bottom: 0.06em; }
			p { position: absolute; left: 72px; bottom: 64px; margin: 0; font: 500 19px/1.4 "JetBrains Mono"; letter-spacing: 0.02em; color: #8e8e96; }
			p b { color: #fff; font-weight: 500; }
		</style>
	</head>
	<body>
		<img class="scene" src="key-visuals/hero.jpg" alt="" />
		<div class="scrim"></div>
		<div class="lockup">
			<svg viewBox="0 0 64 64" fill="currentColor"><path d="M6 8h14v7h-7v34h7v7H6z"/><path d="M58 8H44v7h7v34h-7v7h14z"/><rect x="23" y="23" width="18" height="18"/></svg>
			<span>effectified</span>
		</div>
		<h1><span class="a">npm,</span><span class="b">effectified.</span></h1>
		<p><b>effectified.dev</b> · the libraries you use, Effect-native</p>
	</body>
</html>
